[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "singandmong-archive-mcp"
version = "0.2.13"
description = "A local-first archive for links and notes with MCP and authenticated HTTP capture"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "singandmong"}]
license = {text = "MIT"}

# Phase 2 worker A — reasonable-default version pins.
# Strategy: minimum-floor ranges, not hard pins. Floors picked from latest-stable
# as of 2026-05-18; resolver picks the highest compatible. If a wrapper worker
# (B/C/D) needs a tighter pin, they bump the floor in a follow-up commit.
dependencies = [
    "mcp>=1.0,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
archive-mcp = "mcp_server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.setuptools]
# Single-package layout: this repo *is* the package surface. We expose
# top-level modules (server, tools, wrappers, jobs) as importable namespaces.
py-modules = ["server", "mcp_server"]
packages = ["tools", "wrappers", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
